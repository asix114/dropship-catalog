<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VELORIA — премиальный бутик</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:#0a0a0a;color:#fff}
        .container{max-width:1400px;margin:0 auto;padding:0 30px}
        .header{padding:20px 0;border-bottom:1px solid #ff3366;background:#0a0a0a;position:sticky;top:0;z-index:100}
        .logo-img{height:80px;display:block;margin:0 auto}
        .subtitle{text-align:center;font-size:12px;color:#ff3366;margin-top:5px}
        .nav{display:flex;justify-content:center;gap:40px;margin:20px 0}
        .nav span{cursor:pointer;font-weight:600}
        .nav span:hover,.nav span.active{color:#ff3366}
        .product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:30px;margin:40px 0}
        .product-card{background:#1a1a24;border-radius:20px;padding:20px;text-align:center}
        .product-img{height:150px;display:flex;align-items:center;justify-content:center}
        .product-img img{max-height:120px;max-width:100%}
        .product-title{font-size:18px;font-weight:600;margin:15px 0 5px}
        .product-price{font-size:24px;color:#ff3366;font-weight:700}
        .btn-primary{background:#ff3366;border:none;width:100%;padding:12px;border-radius:40px;color:#fff;font-weight:600;cursor:pointer}
        .btn-secondary{background:#333;border:none;width:100%;padding:10px;border-radius:40px;color:#fff;cursor:pointer;margin-top:10px}
        .cart-icon{position:fixed;bottom:30px;right:30px;background:#ff3366;width:55px;height:55px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:200}
        .cart-count{position:absolute;top:-5px;right:-5px;background:#fff;color:#ff3366;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:12px}
        .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:300;justify-content:center;align-items:center}
        .modal-content{background:#1a1a24;border-radius:30px;padding:30px;max-width:500px;width:90%}
        input,select{width:100%;padding:12px;margin:10px 0;border-radius:30px;background:#333;border:none;color:#fff}
        .admin-table{overflow-x:auto}
        table{width:100%;border-collapse:collapse}
        th,td{padding:10px;text-align:left;border-bottom:1px solid #333}
        th{color:#ff3366}
        footer{text-align:center;padding:40px;color:#666}
        .filter-panel{background:#1a1a24;border-radius:20px;padding:20px;margin:20px 0}
        .filter-row{display:flex;gap:15px;flex-wrap:wrap;margin:15px 0}
        .filter-row input,.filter-row select{width:auto;flex:1}
        button{background:#ff3366;color:#fff;border:none;padding:10px 20px;border-radius:30px;cursor:pointer}
    </style>
</head>
<body>

<div class="cart-icon" onclick="showCart()">
    🛒
    <span id="cartCount" class="cart-count">0</span>
</div>

<div class="header">
    <div class="container">
        <img src="logo.png" alt="VELORIA" class="logo-img">
        <div class="subtitle">премиальный бутик</div>
        <div class="nav">
            <span class="active" onclick="switchSection('catalog')">КАТАЛОГ</span>
            <span onclick="switchSection('profile')">ЛИЧНЫЙ КАБИНЕТ</span>
            <span onclick="showAdminLogin()">АДМИН ВХОД</span>
        </div>
    </div>
</div>

<div class="container">
    <!-- Каталог -->
    <div id="catalogSection">
        <!-- Панель фильтров для каталога (будет видна только админу) -->
        <div id="catalogFilters" class="filter-panel" style="display:none">
            <h3>🔧 Фильтры фида</h3>
            <div class="filter-row">
                <input type="text" id="filterVendors" placeholder="Производители (через запятую)">
                <input type="number" id="filterPriceFrom" placeholder="Цена ОТ">
                <input type="number" id="filterPriceTo" placeholder="Цена ДО">
            </div>
            <div class="filter-row">
                <label><input type="checkbox" id="filterZeroStock"> Обнулять остаток &lt; 3 шт</label>
                <label><input type="checkbox" id="filterMpAllowed"> Только разрешённые для МП</label>
            </div>
            <button onclick="applyFilters()">Применить фильтры</button>
            <button onclick="downloadFilteredCSV()">📥 Скачать отфильтрованный CSV</button>
            <hr style="margin:15px 0">
            <h4>🤖 DeepSeek AI Консультант</h4>
            <input type="text" id="deepseekKey" placeholder="API ключ DeepSeek">
            <button onclick="saveDeepSeekKey()">Сохранить ключ</button>
        </div>
        <div class="product-grid" id="catalogGrid">Загрузка...</div>
    </div>

    <!-- Личный кабинет -->
    <div id="profileSection" style="display:none">
        <div id="profileContent" class="filter-panel"></div>
    </div>
</div>

<!-- Корзина -->
<div id="cartModal" class="modal">
    <div class="modal-content">
        <h3>🛒 Корзина</h3>
        <div id="cartItems"></div>
        <div id="cartTotal"></div>
        <button class="btn-primary" onclick="checkout()">Оформить</button>
        <button class="btn-secondary" onclick="closeModal('cartModal')">Закрыть</button>
    </div>
</div>

<!-- Оформление -->
<div id="checkoutModal" class="modal">
    <div class="modal-content">
        <h3>📝 Оформление заказа</h3>
        <input type="text" id="coName" placeholder="Имя">
        <input type="tel" id="coPhone" placeholder="Телефон">
        <input type="text" id="coAddress" placeholder="Адрес">
        <button class="btn-primary" onclick="submitOrder()">Подтвердить заказ</button>
    </div>
</div>

<!-- Логин админа -->
<div id="adminModal" class="modal">
    <div class="modal-content">
        <h3>Вход в CRM</h3>
        <input type="password" id="adminPass" placeholder="Пароль">
        <button onclick="checkAdminLogin()">Войти</button>
    </div>
</div>

<footer>© 2025 VELORIA — премиальный бутик</footer>

<script>
// ========== ДАННЫЕ ==========
let products = [];
let cart = JSON.parse(localStorage.getItem('cart')) || [];
let currentUser = JSON.parse(localStorage.getItem('user')) || null;
let allOrders = JSON.parse(localStorage.getItem('orders')) || [];
let isAdmin = false;
let currentMarkup = 100; // наценка 100%

// ========== ЗАГРУЗКА CSV ==========
async function loadProducts() {
    try {
        const response = await fetch('велория.csv');
        const text = await response.text();
        const lines = text.split('\n');
        const headers = lines[0].split(';').map(h => h.replace(/["']/g, '').trim());
        
        products = [];
        for (let i = 1; i < lines.length; i++) {
            const values = lines[i].split(';');
            if (values.length < 3) continue;
            const product = {};
            headers.forEach((h, idx) => { product[h] = values[idx]?.replace(/["']/g, '').trim(); });
            
            // Определяем оптовую цену
            let wholesale = parseFloat(product.wholePrice || product.baseWholePrice || product.price || 0);
            if (wholesale > 0) {
                product.wholesale = wholesale;
                product.retailPrice = Math.round(wholesale * (1 + currentMarkup / 100));
                products.push(product);
            }
        }
        
        renderCatalog();
        updateCartCount();
    } catch(e) {
        console.error('Ошибка загрузки CSV:', e);
        document.getElementById('catalogGrid').innerHTML = '<p>Ошибка загрузки товаров. Проверьте файл велория.csv</p>';
    }
}

function renderCatalog() {
    const grid = document.getElementById('catalogGrid');
    if (!products.length) {
        grid.innerHTML = '<p>Нет товаров</p>';
        return;
    }
    
    grid.innerHTML = products.map(p => `
        <div class="product-card">
            <div class="product-img"><img src="${p.images?.split(' ')[0] || 'заглушка.jpg'}" onerror="this.src='заглушка.jpg'"></div>
            <div class="product-title">${p.productName || p.name || 'Товар'}</div>
            <div class="product-price">${p.retailPrice} ₽</div>
            <button class="btn-primary" onclick="addToCart('${p.aID || p.id}')">В КОРЗИНУ</button>
        </div>
    `).join('');
}

function addToCart(id) {
    const p = products.find(p => (p.aID || p.id) == id);
    if (!p) return;
    const existing = cart.find(i => i.id == id);
    if (existing) existing.quantity++;
    else cart.push({ id: id, name: p.productName || p.name, price: p.retailPrice, quantity: 1 });
    localStorage.setItem('cart', JSON.stringify(cart));
    updateCartCount();
}

function updateCartCount() {
    document.getElementById('cartCount').innerText = cart.reduce((s,i) => s + i.quantity, 0);
}

function showCart() {
    const container = document.getElementById('cartItems');
    if (!cart.length) {
        container.innerHTML = '<p>Корзина пуста</p>';
        document.getElementById('cartTotal').innerHTML = '';
    } else {
        container.innerHTML = cart.map(i => `<div>${i.name} x${i.quantity} = ${i.price * i.quantity}₽</div>`).join('');
        document.getElementById('cartTotal').innerHTML = `<strong>Итого: ${cart.reduce((s,i) => s + i.price * i.quantity, 0)} ₽</strong>`;
    }
    document.getElementById('cartModal').style.display = 'flex';
}

function checkout() {
    if (!currentUser) {
        alert('Войдите в личный кабинет');
        switchSection('profile');
        return;
    }
    closeModal('cartModal');
    document.getElementById('checkoutModal').style.display = 'flex';
}

function submitOrder() {
    const name = document.getElementById('coName').value;
    const phone = document.getElementById('coPhone').value;
    const address = document.getElementById('coAddress').value;
    if (!name || !phone || !address) {
        alert('Заполните все поля');
        return;
    }
    
    const total = cart.reduce((s,i) => s + i.price * i.quantity, 0);
    const order = {
        number: 'ORD-' + Date.now(),
        clientName: name,
        clientPhone: phone,
        address: address,
        products: cart.map(i => `${i.name} x${i.quantity}`).join(', '),
        total: total,
        status: '🟡 Новый',
        date: new Date().toLocaleString()
    };
    
    allOrders.unshift(order);
    localStorage.setItem('orders', JSON.stringify(allOrders));
    
    if (!currentUser) {
        currentUser = { name: name, phone: phone };
        localStorage.setItem('user', JSON.stringify(currentUser));
    }
    
    cart = [];
    localStorage.setItem('cart', JSON.stringify(cart));
    updateCartCount();
    closeModal('checkoutModal');
    alert(`Заказ ${order.number} оформлен!`);
}

function renderProfile() {
    const container = document.getElementById('profileContent');
    if (!currentUser) {
        container.innerHTML = `
            <h3>Личный кабинет</h3>
            <input type="text" id="regName" placeholder="Имя">
            <input type="tel" id="regPhone" placeholder="Телефон">
            <button class="btn-primary" onclick="register()">Войти</button>
        `;
    } else {
        const userOrders = allOrders.filter(o => o.clientPhone === currentUser.phone);
        container.innerHTML = `
            <h3>👤 ${currentUser.name}</h3>
            <p>📞 ${currentUser.phone}</p>
            <hr>
            <h4>История заказов</h4>
            ${userOrders.map(o => `
                <div style="background:#333; padding:10px; margin:10px 0; border-radius:10px">
                    <strong>${o.number}</strong><br>
                    ${o.products}<br>
                    ${o.total} ₽ | ${o.status}<br>
                    <small>${o.date}</small>
                </div>
            `).join('')}
            <button class="btn-secondary" onclick="logout()">Выйти</button>
        `;
    }
}

function register() {
    const name = document.getElementById('regName').value;
    const phone = document.getElementById('regPhone').value;
    if (name && phone) {
        currentUser = { name, phone };
        localStorage.setItem('user', JSON.stringify(currentUser));
        renderProfile();
    }
}

function logout() {
    currentUser = null;
    localStorage.removeItem('user');
    renderProfile();
    switchSection('catalog');
}

// ========== АДМИНКА ==========
function showAdminLogin() {
    document.getElementById('adminModal').style.display = 'flex';
}

function checkAdminLogin() {
    const pass = document.getElementById('adminPass').value;
    if (pass === 'admin123') {
        isAdmin = true;
        closeModal('adminModal');
        document.getElementById('catalogFilters').style.display = 'block';
        alert('Добро пожаловать в CRM!');
    } else {
        alert('Неверный пароль');
    }
}

// Фильтрация товаров
function applyFilters() {
    const vendors = document.getElementById('filterVendors').value.split(',').map(v => v.trim().toLowerCase()).filter(v => v);
    const priceFrom = parseFloat(document.getElementById('filterPriceFrom').value) || 0;
    const priceTo = parseFloat(document.getElementById('filterPriceTo').value) || 999999;
    const zeroStock = document.getElementById('filterZeroStock').checked;
    const mpAllowed = document.getElementById('filterMpAllowed').checked;
    
    let filtered = [...products];
    
    if (vendors.length) {
        filtered = filtered.filter(p => vendors.some(v => (p.vendor || '').toLowerCase().includes(v)));
    }
    
    filtered = filtered.filter(p => p.wholesale >= priceFrom && p.wholesale <= priceTo);
    
    if (zeroStock) {
        filtered = filtered.filter(p => parseInt(p.stock || p.p5sStock || 0) >= 3);
    }
    
    if (mpAllowed) {
        filtered = filtered.filter(p => p.mpRule === '1');
    }
    
    // Обновляем отображение
    const grid = document.getElementById('catalogGrid');
    if (!filtered.length) {
        grid.innerHTML = '<p>Нет товаров по выбранным фильтрам</p>';
        return;
    }
    
    grid.innerHTML = filtered.map(p => `
        <div class="product-card">
            <div class="product-img"><img src="${p.images?.split(' ')[0] || 'заглушка.jpg'}" onerror="this.src='заглушка.jpg'"></div>
            <div class="product-title">${p.productName || p.name}</div>
            <div class="product-price">${Math.round(p.wholesale * (1 + currentMarkup/100))} ₽</div>
            <button class="btn-primary" onclick="addToCart('${p.aID || p.id}')">В КОРЗИНУ</button>
        </div>
    `).join('');
}

function downloadFilteredCSV() {
    const vendors = document.getElementById('filterVendors').value.split(',').map(v => v.trim().toLowerCase()).filter(v => v);
    const priceFrom = parseFloat(document.getElementById('filterPriceFrom').value) || 0;
    const priceTo = parseFloat(document.getElementById('filterPriceTo').value) || 999999;
    const zeroStock = document.getElementById('filterZeroStock').checked;
    const mpAllowed = document.getElementById('filterMpAllowed').checked;
    
    let filtered = [...products];
    
    if (vendors.length) {
        filtered = filtered.filter(p => vendors.some(v => (p.vendor || '').toLowerCase().includes(v)));
    }
    filtered = filtered.filter(p => p.wholesale >= priceFrom && p.wholesale <= priceTo);
    if (zeroStock) filtered = filtered.filter(p => parseInt(p.stock || 0) >= 3);
    if (mpAllowed) filtered = filtered.filter(p => p.mpRule === '1');
    
    if (!filtered.length) {
        alert('Нет товаров для выгрузки');
        return;
    }
    
    const headers = ['aID', 'productName', 'vendor', 'wholePrice', 'stock', 'images', 'description'];
    const csvRows = [headers.join(';')];
    
    for (const p of filtered) {
        const row = headers.map(h => p[h] || '').join(';');
        csvRows.push(row);
    }
    
    const blob = new Blob([csvRows.join('\n')], { type: 'text/csv' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'veloria_filtered.csv';
    link.click();
    URL.revokeObjectURL(link.href);
}

function saveDeepSeekKey() {
    const key = document.getElementById('deepseekKey').value;
    if (key) localStorage.setItem('deepseek_key', key);
    alert('Ключ сохранён');
}

function closeModal(id) {
    document.getElementById(id).style.display = 'none';
}

function switchSection(section) {
    document.getElementById('catalogSection').style.display = section === 'catalog' ? 'block' : 'none';
    document.getElementById('profileSection').style.display = section === 'profile' ? 'block' : 'none';
    if (section === 'profile') renderProfile();
}

// Запуск
loadProducts();
</script>
</body>
</html>
