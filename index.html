<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>VELORIA — Премиальный дропшиппинг</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #fefaf8; color: #1a0f14; }
        .container { max-width: 1400px; margin: 0 auto; padding: 0 24px; }
        .site-header { background: linear-gradient(135deg, #241018 0%, #160a12 100%); color: white; padding: 20px 0; position: sticky; top: 0; z-index: 100; }
        .header-flex { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 20px; }
        .logo h2 { font-size: 1.8rem; font-weight: 800; background: linear-gradient(135deg, #fff, #e6b8cc); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .logo p { font-size: 0.8rem; opacity: 0.8; }
        .nav-links { display: flex; gap: 20px; flex-wrap: wrap; }
        .nav-links a { color: #f0e0e6; text-decoration: none; font-weight: 500; cursor: pointer; }
        .cart-icon { position: relative; cursor: pointer; }
        .cart-count { position: absolute; top: -8px; right: -12px; background: #c85c7e; border-radius: 50%; padding: 2px 6px; font-size: 10px; }
        .btn { background: linear-gradient(135deg, #c85c7e, #a23658); color: white; padding: 8px 16px; border-radius: 50px; border: none; cursor: pointer; font-weight: 600; }
        .btn-outline { background: transparent; border: 2px solid #c85c7e; color: #c85c7e; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 25px; margin: 40px 0; }
        .product-card { background: white; border-radius: 24px; padding: 16px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); transition: 0.2s; }
        .product-card:hover { transform: translateY(-4px); }
        .product-img { height: 180px; display: flex; align-items: center; justify-content: center; }
        .product-img img { max-height: 150px; max-width: 100%; }
        .product-price { font-size: 1.3rem; font-weight: 700; color: #c85c7e; margin: 10px 0; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; border-radius: 32px; padding: 30px; max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #f0dbd2; }
        .tab { padding: 8px 20px; cursor: pointer; border-radius: 30px; }
        .tab.active { background: #c85c7e; color: white; }
        .admin-table { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #f0dbd2; }
        .status-select { padding: 5px 10px; border-radius: 20px; background: #faf0ec; border: none; }
        footer { background: #0f0c0e; color: #aa9aa2; padding: 40px 0; margin-top: 50px; text-align: center; }
        @media (max-width: 700px) { .product-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); } }
    </style>
</head>
<body>

<header class="site-header">
    <div class="container header-flex">
        <div class="logo">
            <h2>VELORIA</h2>
            <p>где страсть обретает форму</p>
        </div>
        <div class="nav-links">
            <a onclick="showSection('catalog')">Каталог</a>
            <a onclick="showSection('profile')">Личный кабинет</a>
            <a onclick="showSection('admin')" id="adminLink" style="display:none;">📊 Админ CRM</a>
            <a class="cart-icon" onclick="showCart()"><i class="fas fa-shopping-cart"></i><span id="cartCount" class="cart-count">0</span></a>
            <a onclick="logout()" id="logoutBtn" style="display:none;">Выйти</a>
        </div>
    </div>
</header>

<div class="container">
    <!-- Каталог -->
    <div id="catalogSection">
        <div class="product-grid" id="productGrid">Загрузка...</div>
    </div>

    <!-- Личный кабинет клиента -->
    <div id="profileSection" style="display:none;">
        <h2>📋 Мои заказы</h2>
        <div id="userOrders" style="margin-top: 20px;"></div>
    </div>

    <!-- Админ панель (CRM) -->
    <div id="adminSection" style="display:none;">
        <div class="tabs">
            <div class="tab active" onclick="switchAdminTab('orders')">📦 Заказы</div>
            <div class="tab" onclick="switchAdminTab('clients')">👥 Клиенты</div>
        </div>
        <div id="adminOrdersPanel" class="admin-table"></div>
        <div id="adminClientsPanel" style="display:none;" class="admin-table"></div>
    </div>
</div>

<!-- Модалка корзины -->
<div id="cartModal" class="modal">
    <div class="modal-content">
        <h2>🛒 Корзина</h2>
        <div id="cartItems"></div>
        <div id="cartTotal" style="font-weight:700; margin:15px 0;"></div>
        <button class="btn" onclick="checkout()">Оформить заказ</button>
        <button class="btn-outline" onclick="closeModal('cartModal')">Закрыть</button>
    </div>
</div>

<!-- Модалка оформления заказа -->
<div id="checkoutModal" class="modal">
    <div class="modal-content">
        <h2>📝 Оформление заказа</h2>
        <input type="text" id="checkoutName" placeholder="Ваше имя" style="width:100%; padding:10px; margin:8px 0; border-radius:30px; border:1px solid #ddd;">
        <input type="tel" id="checkoutPhone" placeholder="Телефон" style="width:100%; padding:10px; margin:8px 0; border-radius:30px; border:1px solid #ddd;">
        <input type="text" id="checkoutAddress" placeholder="Адрес доставки" style="width:100%; padding:10px; margin:8px 0; border-radius:30px; border:1px solid #ddd;">
        <select id="checkoutDelivery" style="width:100%; padding:10px; margin:8px 0; border-radius:30px;">
            <option value="СДЭК">СДЭК (350₽)</option>
            <option value="Почта России">Почта России (250₽)</option>
            <option value="Курьер МСК">Курьер по Москве (500₽)</option>
        </select>
        <button class="btn" onclick="submitOrder()">✅ Подтвердить заказ</button>
        <button class="btn-outline" onclick="closeModal('checkoutModal')">Назад</button>
    </div>
</div>

<footer>
    <div class="container">
        <p>© 2025 VELORIA — Дропшиппинг от 1 шт. Ваша прибыль — ваша наценка.</p>
        <p>WhatsApp менеджера: +7-933-331-57-87</p>
    </div>
</footer>

<script>
    // ==================== ВАШ URL ИЗ GOOGLE APPS SCRIPT ====================
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwoZjZVQyHelOk7O4a7OKMk99cu-ILeS4xAk6IEzw-IUDwvC8JbQ-GUuDd45VF1cSz/exec';
    
    // ==================== ТОВАРЫ (временные, для демо) ====================
    const products = [
        { id: 1, name: "Вибратор Elegance", price: 1250, image: "https://via.placeholder.com/150x150?text=VELORIA" },
        { id: 2, name: "Смазка Silky Love 100ml", price: 450, image: "https://via.placeholder.com/150x150?text=VELORIA" },
        { id: 3, name: "Массажер Butterfly", price: 1890, image: "https://via.placeholder.com/150x150?text=VELORIA" },
        { id: 4, name: "Наручники Luxury", price: 890, image: "https://via.placeholder.com/150x150?text=VELORIA" },
        { id: 5, name: "Стимулятор Pearl", price: 2340, image: "https://via.placeholder.com/150x150?text=VELORIA" },
        { id: 6, name: "Анальная пробка Set", price: 1200, image: "https://via.placeholder.com/150x150?text=VELORIA" }
    ];
    
    // Корзина
    let cart = JSON.parse(localStorage.getItem('veloria_cart')) || [];
    let currentUser = JSON.parse(localStorage.getItem('veloria_user')) || null;
    const ADMIN_PASSWORD = 'admin123';
    
    // Отображение каталога
    function renderCatalog() {
        const grid = document.getElementById('productGrid');
        if(!grid) return;
        grid.innerHTML = products.map(p => `
            <div class="product-card">
                <div class="product-img"><img src="${p.image}" alt="${p.name}"></div>
                <h4>${p.name}</h4>
                <div class="product-price">${p.price} ₽</div>
                <button class="btn" onclick="addToCart(${p.id})">В корзину</button>
            </div>
        `).join('');
    }
    
    function addToCart(productId) {
        const product = products.find(p => p.id === productId);
        const existing = cart.find(i => i.id === productId);
        if(existing) existing.quantity++;
        else cart.push({ ...product, quantity: 1 });
        localStorage.setItem('veloria_cart', JSON.stringify(cart));
        updateCartCount();
        alert('Товар добавлен в корзину');
    }
    
    function updateCartCount() {
        const count = cart.reduce((s, i) => s + i.quantity, 0);
        const cartCountSpan = document.getElementById('cartCount');
        if(cartCountSpan) cartCountSpan.innerText = count;
    }
    
    function showCart() {
        const container = document.getElementById('cartItems');
        if(!container) return;
        if(!cart.length) {
            container.innerHTML = '<p>Корзина пуста</p>';
            document.getElementById('cartTotal').innerHTML = '';
        } else {
            container.innerHTML = cart.map(i => `<div class="cart-item">${i.name} x${i.quantity} = ${i.price * i.quantity}₽</div>`).join('');
            const total = cart.reduce((s, i) => s + i.price * i.quantity, 0);
            document.getElementById('cartTotal').innerHTML = `Итого: ${total} ₽`;
        }
        document.getElementById('cartModal').style.display = 'flex';
    }
    
    function checkout() {
        if(!currentUser) {
            alert('Для оформления заказа войдите или зарегистрируйтесь в личном кабинете');
            showSection('profile');
            return;
        }
        closeModal('cartModal');
        document.getElementById('checkoutModal').style.display = 'flex';
    }
    
    async function submitOrder() {
        const name = document.getElementById('checkoutName').value;
        const phone = document.getElementById('checkoutPhone').value;
        const address = document.getElementById('checkoutAddress').value;
        const delivery = document.getElementById('checkoutDelivery').value;
        
        if(!name || !phone || !address) {
            alert('Заполните все поля');
            return;
        }
        
        const total = cart.reduce((s, i) => s + i.price * i.quantity, 0);
        const productsText = cart.map(i => `${i.name} x${i.quantity}`).join(', ');
        const orderNumber = 'ORD-' + Date.now();
        
        // Отправляем данные в Google Таблицу
        try {
            const response = await fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    action: 'order',
                    orderNumber: orderNumber,
                    clientName: name,
                    clientPhone: phone,
                    products: productsText,
                    total: total,
                    status: 'Новый',
                    deliveryAddress: address,
                    deliveryMethod: delivery
                })
            });
            
            // Также сохраняем клиента
            await fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    action: 'client',
                    clientName: name,
                    clientPhone: phone,
                    clientEmail: ''
                })
            });
            
            alert(`Заказ ${orderNumber} оформлен! Менеджер свяжется с вами.`);
            cart = [];
            localStorage.setItem('veloria_cart', JSON.stringify(cart));
            updateCartCount();
            closeModal('checkoutModal');
            
            // Сохраняем пользователя в localStorage
            if(!currentUser) {
                currentUser = { name, phone };
                localStorage.setItem('veloria_user', JSON.stringify(currentUser));
                document.getElementById('logoutBtn').style.display = 'inline';
            }
            
        } catch(e) {
            alert('Ошибка оформления. Заказ сохранён локально, менеджер свяжется с вами.');
            console.error(e);
        }
    }
    
    // Личный кабинет
    function showUserOrders() {
        const container = document.getElementById('userOrders');
        if(!container) return;
        if(!currentUser) {
            container.innerHTML = `
                <div style="padding:20px; text-align:center;">
                    <h3>Вход в личный кабинет</h3>
                    <input type="text" id="loginName" placeholder="Ваше имя" style="width:100%; padding:10px; margin:8px 0; border-radius:30px;">
                    <input type="tel" id="loginPhone" placeholder="Телефон" style="width:100%; padding:10px; margin:8px 0; border-radius:30px;">
                    <button class="btn" onclick="login()">Войти</button>
                    <p style="margin-top:15px; font-size:0.8rem;">При первом входе вы автоматически зарегистрируетесь</p>
                </div>
            `;
        } else {
            container.innerHTML = `
                <div style="padding:20px;">
                    <p><strong>Имя:</strong> ${currentUser.name}</p>
                    <p><strong>Телефон:</strong> ${currentUser.phone}</p>
                    <hr style="margin:15px 0;">
                    <h3>История заказов</h3>
                    <p>Заказы будут отображаться здесь после оформления.</p>
                    <p style="color:#888; font-size:0.8rem;">Все заказы сохраняются в Google Таблице. Для просмотра полной истории обратитесь к менеджеру.</p>
                </div>
            `;
        }
    }
    
    function login() {
        const name = document.getElementById('loginName')?.value;
        const phone = document.getElementById('loginPhone')?.value;
        if(name && phone) {
            currentUser = { name, phone };
            localStorage.setItem('veloria_user', JSON.stringify(currentUser));
            document.getElementById('logoutBtn').style.display = 'inline';
            showSection('profile');
            showUserOrders();
        } else {
            alert('Введите имя и телефон');
        }
    }
    
    function logout() {
        currentUser = null;
        localStorage.removeItem('veloria_user');
        document.getElementById('logoutBtn').style.display = 'none';
        showSection('catalog');
        alert('Вы вышли из личного кабинета');
    }
    
    // Админ панель (CRM)
    function showAdminLogin() {
        const pwd = prompt('Введите пароль администратора:');
        if(pwd === ADMIN_PASSWORD) {
            localStorage.setItem('veloria_admin', 'true');
            document.getElementById('adminLink').style.display = 'inline';
            showSection('admin');
        } else if(pwd !== null) {
            alert('Неверный пароль');
        }
    }
    
    function showAdminPanel() {
        // Показываем заглушку для админки
        document.getElementById('adminOrdersPanel').innerHTML = `
            <div style="padding:20px; text-align:center;">
                <p>📊 Админ-панель в разработке.</p>
                <p>Все заказы и клиенты уже сохраняются в вашу Google Таблицу:</p>
                <p><a href="https://docs.google.com/spreadsheets/d/1EpTByX-nY09VwUc14x5N6m3A0xrFDuu8lHRSYpXb2Gs" target="_blank">📋 Открыть VELORIA CRM</a></p>
                <p style="margin-top:20px; font-size:0.8rem;">Вы можете управлять заказами, менять статусы и отслеживать финансы прямо в таблице.</p>
            </div>
        `;
        document.getElementById('adminClientsPanel').innerHTML = `
            <div style="padding:20px; text-align:center;">
                <p>👥 Все клиенты автоматически попадают в лист "Клиенты" вашей Google Таблицы.</p>
                <p><a href="https://docs.google.com/spreadsheets/d/1EpTByX-nY09VwUc14x5N6m3A0xrFDuu8lHRSYpXb2Gs" target="_blank">📋 Открыть CRM</a></p>
            </div>
        `;
    }
    
    // Навигация
    function showSection(section) {
        document.getElementById('catalogSection').style.display = section === 'catalog' ? 'block' : 'none';
        document.getElementById('profileSection').style.display = section === 'profile' ? 'block' : 'none';
        document.getElementById('adminSection').style.display = section === 'admin' ? 'block' : 'none';
        
        if(section === 'profile') showUserOrders();
        if(section === 'admin') showAdminPanel();
    }
    
    function switchAdminTab(tab) {
        document.getElementById('adminOrdersPanel').style.display = tab === 'orders' ? 'block' : 'none';
        document.getElementById('adminClientsPanel').style.display = tab === 'clients' ? 'block' : 'none';
        const tabs = document.querySelectorAll('.tab');
        tabs.forEach((t, i) => {
            if((tab === 'orders' && i === 0) || (tab === 'clients' && i === 1)) {
                t.classList.add('active');
            } else {
                t.classList.remove('active');
            }
        });
    }
    
    function closeModal(id) {
        document.getElementById(id).style.display = 'none';
    }
    
    // Инициализация
    renderCatalog();
    updateCartCount();
    
    // Проверяем, есть ли админский доступ
    if(localStorage.getItem('veloria_admin') === 'true') {
        document.getElementById('adminLink').style.display = 'inline';
    }
    if(currentUser) {
        document.getElementById('logoutBtn').style.display = 'inline';
    }
    
    // Привязываем функции к окну
    window.showSection = showSection;
    window.showCart = showCart;
    window.addToCart = addToCart;
    window.checkout = checkout;
    window.submitOrder = submitOrder;
    window.closeModal = closeModal;
    window.switchAdminTab = switchAdminTab;
    window.logout = logout;
    window.login = login;
    window.showAdminLogin = showAdminLogin;
    
    // Обработчик для админки (если кликнуть по ссылке)
    document.getElementById('adminLink')?.addEventListener('click', (e) => {
        e.preventDefault();
        const isAdmin = localStorage.getItem('veloria_admin');
        if(isAdmin === 'true') {
            showSection('admin');
        } else {
            showAdminLogin();
        }
    });
</script>
</body>
</html>
